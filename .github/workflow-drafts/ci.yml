# DRAFT — not active. Move it to .github/workflows/ci.yml to turn it on.
name: navide.mini-ide

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # One universal package and no backend: one runner is enough.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/navide-mini-ide.xml
      - name: Build, validate and package
        run: |
          npm run build
          npm run check
          npm run package
      - name: Upload the package and test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: navide-mini-ide
          path: |
            navide-mini-ide.vsix
            test-results/
          retention-days: 7
